<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Mi Perfil | Milenita</title>
        <link rel="stylesheet" th:href="@{/estilos.css}">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>

        <header th:replace="~{plantillas/layout :: navbar}"></header>
        <div th:replace="~{plantillas/layout :: navbar-linea}"></div>

        <main class="container my-5">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="milenita-form-box">
                        <h1 class="section-title text-center mb-4">Mi Perfil</h1>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Nombre</label>
                            <input type="text" class="form-control" th:value="${usuario.nombre}" readonly>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Correo</label>
                            <input type="text" class="form-control" th:value="${usuario.correo}" readonly>
                        </div>

                        <div class="text-center mt-4">
                            <a th:href="@{/}" class="btn milenita-btn-azul">Volver al inicio</a>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer th:replace="~{plantillas/layout :: footer}"></footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
