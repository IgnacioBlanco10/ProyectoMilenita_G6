<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Detalle del Producto | Milenita</title>

        <link rel="stylesheet" th:href="@{/estilos.css}">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>

    <body>

        <header th:replace="~{plantillas/layout :: navbar}"></header>
        <div th:replace="~{plantillas/layout :: navbar-linea}"></div>

        <main class="container my-5">

            <section class="milenita-form-box mb-5">

                <div class="row align-items-center g-4">

                    <div class="col-md-6 text-center">

                        <img th:src="@{'/img/' + ${producto.imagen}}"
                             th:alt="${producto.nombre}"
                             class="img-fluid rounded shadow"
                             style="max-height:420px;object-fit:contain;">

                    </div>

                    <div class="col-md-6">

                        <span class="milenita-badge mb-3"
                              th:if="${producto.destacado}">
                            Destacado
                        </span>

                        <h1 class="section-title mb-2"
                            th:text="${producto.nombre}">
                            Producto
                        </h1>

                        <p class="text-muted mb-3">
                            Categoría:
                            <span th:text="${producto.categoria != null ? producto.categoria.nombre : 'Sin categoría'}"></span>
                        </p>

                        <p class="milenita-price mb-3">
                            ₡<span th:text="${producto.precio}">0</span>
                        </p>

                        <div class="mb-4">

                            <h5 class="fw-bold" style="color:#173b8f;">
                                Descripción
                            </h5>

                            <p th:text="${producto.descripcion}">
                                Descripción
                            </p>

                        </div>

                        <div class="row">

                            <div class="col-sm-6 mb-3">
                                <strong>Sabor:</strong><br>
                                <span th:text="${producto.sabor}"></span>
                            </div>

                            <div class="col-sm-6 mb-3">
                                <strong>Tamaño:</strong><br>
                                <span th:text="${producto.tamano}"></span>
                            </div>

                            <div class="col-12 mb-3">
                                <strong>Ingredientes:</strong><br>
                                <span th:text="${producto.ingredientes}"></span>
                            </div>

                            <div class="col-12 mb-3">
                                <strong>Stock disponible:</strong>
                                <span th:text="${producto.stock}"></span>
                            </div>

                        </div>

                        <div class="d-flex gap-2 flex-wrap mt-3">

                            <a th:href="@{/catalogo}"
                               class="btn milenita-btn-azul">
                                Volver al catálogo
                            </a>

                            <a sec:authorize="hasRole('ADMIN')"
                               th:href="@{/admin/productos/editar/{id}(id=${producto.idProducto})}"
                               class="btn milenita-btn-amarillo">
                                Editar producto
                            </a>

                        </div>

                    </div>

                </div>

            </section>

        </main>

        <footer th:replace="~{plantillas/layout :: footer}"></footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    </body>
</html>
