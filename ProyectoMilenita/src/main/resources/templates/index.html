<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Inicio | Milenita</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/estilos.css}">
    </head>
    <body>

        <div th:replace="~{plantillas/layout :: navbar}"></div>

        <section class="hero">
            <div class="container text-center">
                <h1 class="display-4 fw-bold">Bienvenido a Milenita</h1>
                <p class="lead">Tu tienda en línea para comprar de forma fácil, rápida y segura.</p>
                <a th:href="@{/catalogo}" class="btn btn-primary btn-lg mt-3">Ver catálogo</a>
            </div>
        </section>

        <section class="container mt-5">
            <h2 class="text-center mb-4">Productos destacados</h2>
            <div class="row g-4">
                <div class="col-md-4" th:each="p : ${destacados}">
                    <div class="card shadow-sm h-100">
                        <img th:src="@{'/img/' + ${p.imagen}}" class="card-img-top" th:alt="${p.nombre}">
                        <div class="card-body">
                            <h5 class="card-title" th:text="${p.nombre}">Producto</h5>
                            <p class="card-text" th:text="${p.descripcion}">Descripción</p>
                            <p class="fw-bold">₡<span th:text="${p.precio}">0</span></p>
                            <a th:href="@{/producto/{id}(id=${p.idProducto})}" class="btn btn-outline-primary">Ver detalle</a>
                        </div>
                    </div>
                </div>
            </div>

            <div class="text-center mt-4">
                <a th:href="@{/catalogo}" class="btn btn-primary">Ver más productos</a>
            </div>
        </section>

        <div th:replace="~{plantillas/layout :: footer}"></div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
