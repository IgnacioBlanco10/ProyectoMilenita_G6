<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <body>

        <nav th:fragment="navbar" class="navbar navbar-expand-lg milenita-navbar">
            <div class="container">
                <a class="navbar-brand milenita-brand" th:href="@{/}">Milenitas</a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNav"
                        aria-controls="menuNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="menuNav">
                    <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">

                        <li class="nav-item">
                            <a class="nav-link milenita-link" th:href="@{/}">Inicio</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link milenita-link" th:href="@{/catalogo}">Productos</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link milenita-link" th:href="@{/comentarios}">Comentarios</a>
                        </li>

                        <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                            <a class="nav-link milenita-link admin-link" th:href="@{/admin/productos}">
                                Admin
                            </a>
                        </li>

                        <li class="nav-item" sec:authorize="isAnonymous()">
                            <a class="nav-link milenita-link" th:href="@{/login}">Login</a>
                        </li>

                        <li class="nav-item" sec:authorize="isAnonymous()">
                            <a class="nav-link milenita-link" th:href="@{/registro-form}">Registro</a>
                        </li>

                        <li class="nav-item" sec:authorize="isAuthenticated()">
                            <span class="nav-link milenita-link">
                                Hola, <span sec:authentication="name"></span>
                            </span>
                        </li>

                        <li class="nav-item" sec:authorize="isAuthenticated()">
                            <form th:action="@{/logout}" method="post" class="m-0">
                                <button type="submit" class="btn btn-sm milenita-btn-outline">
                                    Cerrar sesión
                                </button>
                            </form>
                        </li>

                    </ul>
                </div>
            </div>
        </nav>

        <div th:fragment="navbar-linea" class="navbar-linea-roja"></div>

        <footer th:fragment="footer" class="milenita-footer">
            <div class="container">
                <div class="row align-items-center gy-4">
                    <div class="col-md-5">
                        <h4 class="footer-brand">Milenitas</h4>
                        <p class="footer-text mb-0">
                            "El sabor que trasciende generaciones: descubre el crujido único de Milenitas."
                        </p>
                    </div>

                    <div class="col-md-3">
                        <h5 class="footer-title">Sitio</h5>
                        <ul class="footer-list">
                            <li><a th:href="@{/}">Inicio</a></li>
                            <li><a th:href="@{/catalogo}">Productos</a></li>
                            <li><a th:href="@{/comentarios}">Comentarios</a></li>
                        </ul>
                    </div>

                    <div class="col-md-4">
                        <h5 class="footer-title">Contáctenos</h5>
                        <p class="footer-text">0000-0000</p>
                        <button class="btn milenita-btn-amarillo">Suscribirse</button>
                    </div>
                </div>
            </div>
        </footer>

    </body>
</html>
