<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Catálogo | Milenita</title>

        <link rel="stylesheet" th:href="@{/estilos.css}">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>

    <body>

        <header th:replace="~{plantillas/layout :: navbar}"></header>
        <div th:replace="~{plantillas/layout :: navbar-linea}"></div>

        <main class="container my-5">

            <h1 class="text-center section-title mb-5">Catálogo de Productos</h1>

            <div class="row g-4">

                <div class="col-md-4"
                     th:each="p : ${productos}">

                    <div class="card milenita-card h-100">

                        <img th:src="@{'/img/' + ${p.imagen}}"
                             th:alt="${p.nombre}"
                             class="card-img-top">

                        <div class="card-body d-flex flex-column">

                            <span class="milenita-badge mb-2"
                                  th:if="${p.destacado}">
                                Destacado
                            </span>

                            <h5 class="card-title"
                                th:text="${p.nombre}">
                                Producto
                            </h5>

                            <p class="text-muted mb-2"
                               th:text="${p.categoria != null ? p.categoria.nombre : 'Sin categoría'}">
                                Categoría
                            </p>

                            <p class="card-text"
                               th:text="${p.descripcion}">
                                Descripción del producto
                            </p>

                            <p class="milenita-price mt-auto mb-3">
                                ₡<span th:text="${p.precio}">0</span>
                            </p>

                            <a th:href="@{/producto/{id}(id=${p.idProducto})}"
                               class="btn milenita-btn-azul">
                                Ver producto
                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </main>

        <footer th:replace="~{plantillas/layout :: footer}"></footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    </body>
</html>
