<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Catálogo | Milenita</title>
        <link rel="stylesheet" th:href="@{/estilos.css}">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>

        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand fw-bold" th:href="@{/}">Milenita</a>
                <div class="navbar-nav ms-auto">
                    <a class="nav-link" th:href="@{/}">Inicio</a>
                    <a class="nav-link" th:href="@{/catalogo}">Catálogo</a>
                    <a class="nav-link" th:href="@{/login}">Login</a>
                    <a class="nav-link" th:href="@{/registro-form}">Registro</a>
                </div>
            </div>
        </nav>

        <main class="container my-5">
            <h1 class="text-center mb-4">Catálogo de Productos</h1>

            <form th:action="@{/catalogo}" method="get" class="row g-3 justify-content-center mb-4">
                <div class="col-md-6">
                    <input type="text" name="busqueda" class="form-control"
                           placeholder="Buscar producto..."
                           th:value="${busqueda}">
                </div>
                <div class="col-md-auto">
                    <button type="submit" class="btn btn-dark">Buscar</button>
                </div>
                <div class="col-md-auto">
                    <a th:href="@{/catalogo}" class="btn btn-outline-secondary">Limpiar</a>
                </div>
            </form>

            <div class="text-center mb-4">
                <a th:href="@{/catalogo}" class="btn btn-outline-dark me-2">Todas</a>

                <span th:each="c : ${categorias}">
                    <a th:href="@{/catalogo(categoria=${c.idCategoria})}"
                       th:text="${c.nombre}"
                       class="btn btn-outline-dark me-2 mb-2">Categoría</a>
                </span>
            </div>

            <div th:if="${productos != null}">
                <div class="row">
                    <div class="col-md-4 mb-4" th:each="p : ${productos}">
                        <div class="card h-100 shadow-sm">
                            <img th:src="@{'/img/' + ${p.imagen}}"
                                 th:alt="${p.nombre}"
                                 class="card-img-top"
                                 style="height: 250px; object-fit: cover;">

                            <div class="card-body d-flex flex-column">
                                <h5 class="card-title" th:text="${p.nombre}">Nombre</h5>

                                <p class="text-muted"
                                   th:text="${p.categoria != null ? p.categoria.nombre : 'Sin categoría'}">
                                    Categoría
                                </p>

                                <p class="card-text" th:text="${p.descripcion}">Descripción</p>

                                <p class="fw-bold mt-auto">
                                    ₡<span th:text="${p.precio}">0</span>
                                </p>

                                <a th:href="@{/producto/{id}(id=${p.idProducto})}"
                                   class="btn btn-dark">
                                    Ver producto
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="alert alert-info text-center"
                 th:if="${productos == null or productos.isEmpty()}">
                No se encontraron productos para mostrar.
            </div>
        </main>

        <footer class="bg-dark text-white text-center py-3 mt-5">
            <div class="container">
                <p class="mb-0">© 2026 Milenita - Tienda en línea</p>
            </div>
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
