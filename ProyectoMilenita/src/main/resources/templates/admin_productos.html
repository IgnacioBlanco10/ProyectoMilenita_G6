<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Administrar Productos | Milenita</title>
        <link rel="stylesheet" th:href="@{/estilos.css}">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>
        <header th:replace="~{plantillas/layout :: navbar}"></header>
        <div th:replace="~{plantillas/layout :: navbar-linea}"></div>

        <main class="container my-5">
            <h1 class="text-center mb-4">Administración de Productos</h1>

            <div class="d-flex justify-content-end mb-3">
                <a th:href="@{/admin/productos/nuevo}" class="btn btn-success">
                    Agregar producto
                </a>
            </div>

            <div class="table-responsive">
                <table class="table table-bordered table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Imagen</th>
                            <th>Nombre</th>
                            <th>Categoría</th>
                            <th>Precio</th>
                            <th>Stock</th>
                            <th>Activo</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="p : ${productos}">
                            <td th:text="${p.idProducto}">1</td>
                            <td>
                                <img th:src="@{'/img/' + ${p.imagen}}"
                                     th:alt="${p.nombre}"
                                     width="70">
                            </td>
                            <td th:text="${p.nombre}">Producto</td>
                            <td th:text="${p.categoria != null ? p.categoria.nombre : 'Sin categoría'}">Categoría</td>
                            <td>₡<span th:text="${p.precio}">0</span></td>
                            <td th:text="${p.stock}">0</td>
                            <td th:text="${p.activo ? 'Sí' : 'No'}">Sí</td>
                            <td>
                                <a th:href="@{/admin/productos/editar/{id}(id=${p.idProducto})}"
                                   class="btn btn-warning btn-sm">
                                    Editar
                                </a>
                                <a th:href="@{/admin/productos/eliminar/{id}(id=${p.idProducto})}"
                                   class="btn btn-danger btn-sm"
                                   onclick="return confirm('¿Seguro que deseas eliminar este producto?');">
                                    Eliminar
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>

        <footer th:replace="~{plantillas/layout :: footer}"></footer>

    </body>
</html>
