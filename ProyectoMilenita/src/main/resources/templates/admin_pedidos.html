<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Administrar Pedidos | La Milenita</title>
        <link rel="stylesheet" th:href="@{/estilos.css}">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>

        <header th:replace="~{plantillas/layout :: navbar}"></header>
        <div th:replace="~{plantillas/layout :: navbar-linea}"></div>

        <main class="container my-5">
            <h1 class="section-title text-center mb-4">Administración de Pedidos</h1>

            <div class="milenita-form-box">
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead>
                            <tr>
                                <th>ID Pedido</th>
                                <th>Factura</th>
                                <th>Cliente</th>
                                <th>Correo</th>
                                <th>Estado actual</th>
                                <th>Cambiar estado</th>
                                <th>Ver factura</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="p : ${pedidos}">
                                <td th:text="${p.idPedido}">1</td>
                                <td th:text="${p.factura.idFactura}">1</td>
                                <td th:text="${p.usuario.nombre}">Cliente</td>
                                <td th:text="${p.usuario.correo}">correo</td>

                                <td>
                                    <span th:if="${p.estado.name() == 'PROCESANDO'}" class="badge bg-warning text-dark">
                                        En proceso
                                    </span>
                                    <span th:if="${p.estado.name() == 'EN_CAMINO'}" class="badge bg-primary">
                                        En camino
                                    </span>
                                    <span th:if="${p.estado.name() == 'ENTREGADO'}" class="badge bg-success">
                                        Entregado
                                    </span>
                                </td>

                                <td>
                                    <form th:action="@{/admin/pedidos/estado}" method="post" class="d-flex gap-2 flex-wrap">
                                        <input type="hidden" name="idPedido" th:value="${p.idPedido}">

                                        <select name="estado" class="form-select form-select-sm" style="width: 160px;">
                                            <option th:each="e : ${estados}"
                                                    th:value="${e}"
                                                    th:text="${e}"
                                                    th:selected="${e == p.estado}">
                                            </option>
                                        </select>

                                        <button type="submit" class="btn btn-warning btn-sm">
                                            Guardar
                                        </button>
                                    </form>
                                </td>

                                <td>
                                    <a th:href="@{/verFactura/{id}(id=${p.factura.idFactura})}"
                                       class="btn btn-outline-dark btn-sm">
                                        Ver factura
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>

        <footer th:replace="~{plantillas/layout :: footer}"></footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
