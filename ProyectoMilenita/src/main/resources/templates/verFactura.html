<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Factura | Milenita</title>
        <link rel="stylesheet" th:href="@{/estilos.css}">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>

        <header th:replace="~{plantillas/layout :: navbar}"></header>
        <div th:replace="~{plantillas/layout :: navbar-linea}"></div>

        <main class="container my-5">
            <div class="milenita-form-box">
                <h1 class="section-title text-center mb-4">Factura de Compra</h1>

                <div class="mb-3">
                    <strong>Número de factura:</strong>
                    <span th:text="${factura.idFactura}"></span>
                </div>

                <div class="mb-3">
                    <strong>Fecha:</strong>
                    <span th:text="${#temporals.format(factura.fecha, 'dd/MM/yyyy HH:mm')}"></span>
                </div>

                <div class="mb-3">
                    <strong>Estado:</strong>
                    <span th:text="${factura.estado}"></span>
                </div>

                <div class="mb-4">
                    <strong>Total:</strong>
                    ₡<span th:text="${factura.total}"></span>
                </div>

                <h4 class="mb-3">Productos</h4>
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead>
                            <tr>
                                <th>Producto</th>
                                <th>Cantidad</th>
                                <th>Precio histórico</th>
                                <th>Subtotal</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="venta : ${factura.ventas}">
                                <td th:text="${venta.producto.nombre}">Producto</td>
                                <td th:text="${venta.cantidad}">1</td>
                                <td>₡<span th:text="${venta.precioHistorico}">0</span></td>
                                <td>₡<span th:text="${venta.subtotal}">0</span></td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="mt-4 d-flex gap-2 flex-wrap">
                    <a th:href="@{/catalogo}" class="btn milenita-btn-azul">Seguir comprando</a>
                    <a th:href="@{/carrito}" class="btn milenita-btn-rojo">Volver al carrito</a>
                </div>
            </div>
        </main>

        <footer th:replace="~{plantillas/layout :: footer}"></footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
