<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Formulario de Producto | Milenita</title>
        <link rel="stylesheet" th:href="@{/estilos.css}">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>
        <header th:replace="~{plantillas/layout :: navbar}"></header>
        <div th:replace="~{plantillas/layout :: navbar-linea}"></div>

        <main class="container my-5">
            <h1 class="text-center mb-4">Guardar Producto</h1>

            <div class="row justify-content-center">
                <div class="col-md-8">
                    <form th:action="@{/admin/productos/guardar}" th:object="${producto}" method="post">

                        <input type="hidden" th:field="*{idProducto}">

                        <div class="mb-3">
                            <label class="form-label">Nombre</label>
                            <input type="text" th:field="*{nombre}" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Descripción</label>
                            <textarea th:field="*{descripcion}" class="form-control" rows="3" required></textarea>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Precio</label>
                                <input type="number" step="0.01" th:field="*{precio}" class="form-control" required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Stock</label>
                                <input type="number" th:field="*{stock}" class="form-control" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Imagen</label>
                            <input type="text" th:field="*{imagen}" class="form-control" placeholder="ejemplo.jpeg" required>
                        </div>

                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Sabor</label>
                                <input type="text" th:field="*{sabor}" class="form-control">
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label">Tamaño</label>
                                <input type="text" th:field="*{tamano}" class="form-control">
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label">Categoría</label>
                                <select th:field="*{categoria}" class="form-select" required>
                                    <option value="">Seleccione una categoría</option>
                                    <option th:each="c : ${categorias}"
                                            th:value="${c.idCategoria}"
                                            th:text="${c.nombre}">
                                    </option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Ingredientes</label>
                            <textarea th:field="*{ingredientes}" class="form-control" rows="2"></textarea>
                        </div>

                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" th:field="*{activo}">
                            <label class="form-check-label">Activo</label>
                        </div>

                        <div class="form-check mb-4">
                            <input class="form-check-input" type="checkbox" th:field="*{destacado}">
                            <label class="form-check-label">Destacado</label>
                        </div>

                        <button type="submit" class="btn btn-success w-100">Guardar producto</button>
                    </form>
                </div>
            </div>
        </main>
        <footer th:replace="~{plantillas/layout :: footer}"></footer>
    </body>
</html>
