<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Comentarios | Milenita</title>
        <link rel="stylesheet" th:href="@{/estilos.css}">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>

        <header th:replace="~{plantillas/layout :: navbar}"></header>
        <div th:replace="~{plantillas/layout :: navbar-linea}"></div>

        <main class="container my-5">

            <section class="text-center mb-5">
                <h1 class="section-title">Comentarios de nuestros usuarios</h1>
                <p>Conoce las opiniones de quienes ya probaron nuestros productos.</p>
            </section>

            <div class="row g-4" th:if="${comentarios != null and !#lists.isEmpty(comentarios)}">
                <div class="col-md-4" th:each="c : ${comentarios}">
                    <div class="card milenita-card h-100"
                         style="background:#1f33a6; border:4px solid #e53935; color:white;">
                        <div class="card-body d-flex flex-column">

                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <h5 class="card-title mb-0" style="color:#ffd54f;" th:text="${c.usuario.nombre}">
                                    Usuario
                                </h5>
                            </div>

                            <p class="mb-2">
                                <strong>Producto:</strong>
                                <span th:text="${c.producto.nombre}">Producto</span>
                            </p>

                            <p class="mb-3" th:text="${c.contenido}">
                                Comentario
                            </p>

                            <div class="mt-auto">
                                <span th:each="i : ${#numbers.sequence(1,5)}"
                                      th:text="${i <= c.calificacion} ? '★' : '☆'"
                                      style="font-size:1.4rem; color:#ffd54f;">
                                    ★
                                </span>
                            </div>

                            <small class="mt-2" th:text="${#temporals.format(c.fecha, 'dd/MM/yyyy HH:mm')}">
                                fecha
                            </small>
                        </div>
                    </div>
                </div>
            </div>

            <div class="alert alert-info text-center"
                 th:if="${comentarios == null or #lists.isEmpty(comentarios)}">
                Aún no hay comentarios publicados.
            </div>

        </main>

        <footer th:replace="~{plantillas/layout :: footer}"></footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
