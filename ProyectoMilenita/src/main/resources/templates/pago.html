<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Pagar | Milenita</title>
        <link rel="stylesheet" th:href="@{/estilos.css}">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>

        <header th:replace="~{plantillas/layout :: navbar}"></header>
        <div th:replace="~{plantillas/layout :: navbar-linea}"></div>

        <main class="container my-5">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="milenita-form-box">
                        <h1 class="section-title text-center mb-4">Información de Pago</h1>

                        <p class="text-center mb-4">
                            Total a pagar:
                            <strong>₡<span th:text="${total}">0</span></strong>
                        </p>

                        <div th:if="${error}" class="alert alert-danger text-center" th:text="${error}"></div>

                        <form th:action="@{/pago/confirmar}" method="post">
                            <div class="mb-3">
                                <label class="form-label fw-bold">Nombre en la tarjeta</label>
                                <input type="text" name="nombreTarjeta" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Número de tarjeta</label>
                                <input type="text" name="numeroTarjeta" class="form-control"
                                       maxlength="19" placeholder="1234 5678 9012 3456" required>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">Vencimiento</label>
                                    <input type="text" name="vencimiento" class="form-control"
                                           placeholder="MM/AA" required>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">CVV</label>
                                    <input type="password" name="cvv" class="form-control"
                                           maxlength="4" required>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-bold">Dirección de entrega</label>
                                <textarea name="direccion" class="form-control" rows="3" required></textarea>
                            </div>

                            <div class="d-flex gap-2 flex-wrap">
                                <a th:href="@{/carrito}" class="btn milenita-btn-azul flex-fill">
                                    Volver al carrito
                                </a>

                                <button type="submit" class="btn milenita-btn-rojo flex-fill">
                                    Confirmar compra
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>

        <footer th:replace="~{plantillas/layout :: footer}"></footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
