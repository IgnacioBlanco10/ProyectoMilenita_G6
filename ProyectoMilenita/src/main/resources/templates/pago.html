<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Pago | Milenita</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/estilos.css}">
    </head>
    <body>

        <div th:replace="~{plantillas/layout :: navbar}"></div>

        <div class="container mt-5">
            <div class="row justify-content-center">
                <div class="col-md-7">
                    <div class="card shadow p-4">
                        <h2 class="mb-4 text-center">Método de Pago</h2>

                        <form>
                            <div class="mb-3">
                                <label class="form-label">Nombre en la tarjeta</label>
                                <input type="text" class="form-control" placeholder="Ingrese el nombre">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Número de tarjeta</label>
                                <input type="text" class="form-control" placeholder="0000 0000 0000 0000">
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Fecha de vencimiento</label>
                                    <input type="text" class="form-control" placeholder="MM/AA">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">CVV</label>
                                    <input type="text" class="form-control" placeholder="123">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Dirección de envío</label>
                                <input type="text" class="form-control" placeholder="Ingrese la dirección">
                            </div>

                            <div class="d-grid">
                                <a th:href="@{/confirmacion}" class="btn btn-success btn-lg">Confirmar compra</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <div th:replace="~{plantillas/layout :: footer}"></div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
