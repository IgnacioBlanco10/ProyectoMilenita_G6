<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Formulario Usuario | Milenita</title>
        <link rel="stylesheet" th:href="@{/estilos.css}">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>

        <header th:replace="~{plantillas/layout :: navbar}"></header>
        <div th:replace="~{plantillas/layout :: navbar-linea}"></div>

        <main class="container my-5">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="milenita-form-box">
                        <h1 class="section-title text-center mb-4"
                            th:text="${usuario.idUsuario == null} ? 'Agregar Usuario' : 'Editar Usuario'">
                            Usuario
                        </h1>

                        <form th:action="@{/admin/usuarios/guardar}" th:object="${usuario}" method="post">

                            <input type="hidden" th:field="*{idUsuario}">

                            <div class="mb-3">
                                <label class="form-label fw-bold">Nombre</label>
                                <input type="text" th:field="*{nombre}" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Correo</label>
                                <input type="email" th:field="*{correo}" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Contraseña</label>
                                <input type="password" th:field="*{password}" class="form-control"
                                       placeholder="Déjalo vacío para no cambiarla">
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Roles</label>
                                <div class="form-check" th:each="rol : ${roles}">
                                    <input class="form-check-input"
                                           type="checkbox"
                                           th:field="*{roles}"
                                           th:value="${rol.idRol}">
                                    <label class="form-check-label" th:text="${rol.nombre}">ROL</label>
                                </div>
                            </div>

                            <div class="form-check mb-3">
                                <input class="form-check-input" type="checkbox" th:field="*{activo}">
                                <label class="form-check-label">Activo</label>
                            </div>

                            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                            <button type="submit" class="btn milenita-btn-azul w-100">Guardar usuario</button>
                        </form>
                    </div>
                </div>
            </div>
        </main>

        <footer th:replace="~{plantillas/layout :: footer}"></footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
