<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Carrito | Milenita</title>
        <link rel="stylesheet" th:href="@{/estilos.css}">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>

        <header th:replace="~{plantillas/layout :: navbar}"></header>
        <div th:replace="~{plantillas/layout :: navbar-linea}"></div>

        <main class="container my-5">
            <h1 class="section-title text-center mb-4">Carrito de Compras</h1>

            <div class="milenita-form-box" th:if="${carritoItems != null and !#lists.isEmpty(carritoItems)}">
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead>
                            <tr>
                                <th>Imagen</th>
                                <th>Producto</th>
                                <th>Precio</th>
                                <th>Cantidad</th>
                                <th>Subtotal</th>
                                <th>Cambiar</th>
                                <th>Eliminar</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="item : ${carritoItems}">
                                <td>
                                    <img th:src="@{'/img/' + ${item.producto.imagen}}"
                                         th:alt="${item.producto.nombre}"
                                         style="width:70px;height:70px;object-fit:cover;border-radius:10px;">
                                </td>
                                <td th:text="${item.producto.nombre}">Producto</td>
                                <td>₡<span th:text="${item.precioHistorico}">0</span></td>
                                <td th:text="${item.cantidad}">1</td>
                                <td>₡<span th:text="${item.subTotal}">0</span></td>
                                <td>
                                    <form th:action="@{/carrito/modificar}" method="post" class="d-flex gap-2">
                                        <input type="hidden" name="idProducto" th:value="${item.producto.idProducto}">
                                        <input type="number" name="cantidad" min="0" th:value="${item.cantidad}"
                                               class="form-control form-control-sm" style="width:80px;">
                                        <button type="submit" class="btn btn-warning btn-sm">Actualizar</button>
                                    </form>
                                </td>
                                <td>
                                    <a th:href="@{/carrito/eliminar/{id}(id=${item.producto.idProducto})}"
                                       class="btn btn-danger btn-sm">
                                        Eliminar
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="d-flex justify-content-between align-items-center mt-4 flex-wrap gap-3">
                    <h4>Total: ₡<span th:text="${carritoTotal}">0</span></h4>

                    <div class="d-flex gap-2 flex-wrap">
                        <a th:href="@{/catalogo}" class="btn milenita-btn-azul">Seguir comprando</a>

                        <a th:href="@{/pago}" class="btn milenita-btn-rojo">Pagar</a>
                    </div>
                </div>
            </div>

            <div class="alert alert-info text-center" th:if="${carritoItems == null or #lists.isEmpty(carritoItems)}">
                Tu carrito está vacío.
            </div>
        </main>

        <footer th:replace="~{plantillas/layout :: footer}"></footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
