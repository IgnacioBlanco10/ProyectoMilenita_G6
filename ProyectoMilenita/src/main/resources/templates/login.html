<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login | Milenita</title>
        <link rel="stylesheet" th:href="@{/estilos.css}">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>

        <header th:replace="~{plantillas/layout :: navbar}"></header>
        <div th:replace="~{plantillas/layout :: navbar-linea}"></div>

        <main class="container my-5">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="milenita-form-box">
                        <h1 class="text-center section-title mb-4">Iniciar Sesión</h1>
                        
                        <form th:action="@{/login}" method="post">
                            
                            <div class="text-center mt-4">
                                <p class="mb-3 fw-bold">O inicia sesión con</p>

                                <div class="d-flex justify-content-center gap-3 flex-wrap">

                                    <a href="https://www.facebook.com/login"
                                       target="_blank"
                                       class="btn btn-light border d-flex align-items-center gap-2 px-4 py-2">

                                        <img th:src="@{/img/facebook.jpeg}" alt="Facebook" width="22">
                                        Facebook
                                    </a>

                                    <a href="https://www.instagram.com/accounts/login/"
                                       target="_blank"
                                       class="btn d-flex align-items-center gap-2 px-4 py-2 text-white"
                                       style="background: linear-gradient(45deg,#feda75,#d62976,#962fbf,#4f5bd5);">

                                        <img th:src="@{/img/instagram.jpeg}" alt="Instagram" width="22">
                                        Instagram
                                    </a>

                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Correo</label>
                                <input type="email" name="correo" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Contraseña</label>
                                <input type="password" name="password" class="form-control" required>
                            </div>

                            <div th:if="${param.error}" class="alert alert-danger">
                                Credenciales incorrectas.
                            </div>

                            <div th:if="${param.logout}" class="alert alert-success">
                                Sesión cerrada correctamente.
                            </div>

                            <div th:if="${param.registroExitoso}" class="alert alert-success">
                                Registro exitoso. Ahora puedes iniciar sesión.
                            </div>

                            <button type="submit" class="btn milenita-btn-rojo w-100">Ingresar</button>
                        </form>

                        <div class="text-center mt-4">
                            <p class="mb-0">
                                ¿No tienes cuenta?
                                <a th:href="@{/registro-form}" class="fw-bold" style="color:#173b8f;">Regístrate</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer th:replace="~{plantillas/layout :: footer}"></footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
