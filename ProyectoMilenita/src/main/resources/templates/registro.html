<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Registro | Milenita</title>
        <link rel="stylesheet" th:href="@{/estilos.css}">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>

        <header th:replace="~{plantillas/layout :: navbar}"></header>
        <div th:replace="~{plantillas/layout :: navbar-linea}"></div>

        <main class="container my-5">
            <div class="row justify-content-center">
                <div class="col-md-7">
                    <div class="milenita-form-box">
                        <h1 class="text-center section-title mb-4">Crear Cuenta</h1>

                        <form th:action="@{/registro}" th:object="${usuario}" method="post">
                            <div class="mb-3">
                                <label class="form-label fw-bold">Nombre</label>
                                <input type="text" th:field="*{nombre}" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Género</label>

                                <select th:field="*{genero}" class="form-select">
                                    <option value="">Seleccione una opción</option>
                                    <option value="HOMBRE">Hombre</option>
                                    <option value="MUJER">Mujer</option>
                                    <option value="NO_DECIR">Prefiero no decir</option>
                                </select>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label fw-bold">Correo</label>
                                <input type="email" th:field="*{correo}" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Contraseña</label>
                                <input type="password" th:field="*{password}" class="form-control" required>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-bold d-block">Escoge tu foto de perfil</label>

                                <div class="d-flex gap-4 flex-wrap">
                                    <label class="text-center">
                                        <input type="radio" th:field="*{fotoPerfil}" value="logo_milenita.jpeg" required>
                                        <div class="mt-2">
                                            <img th:src="@{/img/logo_milenita.jpeg}" alt="Logo Milenita"
                                                 style="width:90px; height:90px; object-fit:cover; border-radius:50%; border:2px solid #ccc;">
                                        </div>
                                    </label>

                                    <label class="text-center">
                                        <input type="radio" th:field="*{fotoPerfil}" value="sticker_moderno.jpeg" required>
                                        <div class="mt-2">
                                            <img th:src="@{/img/sticker_moderno.jpeg}" alt="Sticker moderno"
                                                 style="width:90px; height:90px; object-fit:cover; border-radius:50%; border:2px solid #ccc;">
                                        </div>
                                    </label>
                                </div>
                            </div>

                            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                            <button type="submit" class="btn milenita-btn-azul w-100">Registrarse</button>
                        </form>

                        <div class="text-center mt-4">
                            <p class="mb-0">
                                ¿Ya tienes cuenta?
                                <a th:href="@{/login}" class="fw-bold" style="color:#d62828;">Inicia sesión</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer th:replace="~{plantillas/layout :: footer}"></footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
