<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Usuarios | Milenita</title>
        <link rel="stylesheet" th:href="@{/estilos.css}">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>

        <header th:replace="~{plantillas/layout :: navbar}"></header>
        <div th:replace="~{plantillas/layout :: navbar-linea}"></div>

        <main class="container my-5">
            <h1 class="section-title text-center mb-4">Administración de Usuarios</h1>

            <div class="d-flex justify-content-end mb-3">
                <a th:href="@{/admin/usuarios/nuevo}" class="btn milenita-btn-rojo">
                    Agregar usuario
                </a>
            </div>

            <div class="table-responsive milenita-form-box">
                <table class="table align-middle">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Correo</th>
                            <th>Activo</th>
                            <th>Roles</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="u : ${usuarios}">
                            <td th:text="${u.idUsuario}">1</td>
                            <td th:text="${u.nombre}">Nombre</td>
                            <td th:text="${u.correo}">correo</td>
                            <td th:text="${u.activo ? 'Sí' : 'No'}">Sí</td>
                            <td>
                                <span th:each="r : ${u.roles}" th:text="${r.nombre} + ' '">ROL</span>
                            </td>
                            <td>
                                <a th:href="@{/admin/usuarios/editar/{id}(id=${u.idUsuario})}"
                                   class="btn btn-warning btn-sm">
                                    Editar
                                </a>
                                <a th:href="@{/admin/usuarios/eliminar/{id}(id=${u.idUsuario})}"
                                   class="btn btn-danger btn-sm"
                                   onclick="return confirm('¿Seguro que deseas desactivar este usuario?');">
                                    Eliminar
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>

        <footer th:replace="~{plantillas/layout :: footer}"></footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
